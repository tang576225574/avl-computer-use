[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avl-desktop-model"
version = "2.1.1"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "websockets>=14,<16"]

[project.scripts]
avl-model = "model.adapter:main"
avl-localize = "model.evaluate:main"

[tool.setuptools]
packages = ["model"]

[tool.setuptools.package-data]
model = ["fixtures/*.json", "fixtures/*.jpg"]
